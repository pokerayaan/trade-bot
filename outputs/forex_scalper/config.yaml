account:
  equity: 10000
  risk_per_trade: 0.01
  max_open_trades: 3
  max_daily_loss: 0.03

strategy:
  style: "hybrid_scalp"
  timeframe: "5m"
  lookback_bars: 300
  top_n_pairs: 6
  min_adx: 12
  range_adx_max: 22
  fast_ema: 9
  slow_ema: 21
  trend_ema: 200
  rsi_period: 14
  atr_period: 14
  bb_period: 20
  bb_std: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  stop_atr_multiple: 0.9
  range_stop_atr_multiple: 0.75
  reward_risk: 1.15
  range_reward_risk: 0.9
  break_even_at_r: 1.0
  trailing_atr_multiple: 0.8

filters:
  trade_days_utc: [0, 1, 2, 3, 4]
  london_new_york_overlap_only: false
  session_start_utc: "00:00"
  session_end_utc: "23:59"
  max_spread_pips:
    EURUSD: 1.2
    GBPUSD: 1.8
    USDJPY: 1.4
    AUDUSD: 1.6
    NZDUSD: 1.8
    USDCAD: 1.8
    USDCHF: 1.8
    EURJPY: 2.0
    GBPJPY: 2.8
    AUDJPY: 2.2
    EURGBP: 1.6
    EURAUD: 2.4

universe:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - NZDUSD
  - USDCAD
  - USDCHF
  - EURJPY
  - GBPJPY
  - AUDJPY
  - EURGBP
  - EURAUD

execution:
  mode: "live"
  mt5_deviation_points: 20
  mt5_magic: 260610
  poll_seconds: 30

test_order:
  pair: "EURUSD"
  side: "buy"
  quantity: 0.01

tradelocker:
  env: "https://demo.tradelocker.com"
  api_base: "https://demo.tradelocker.com/backend-api"
  server: "GATESFX"
  account_id: ""
  account_number: ""
  use_broker_candles: false
  market_data_fallback: "yfinance"
  symbol_overrides: {}
  endpoints:
    auth:
      - "/auth/jwt/token"
      - "/auth/login"
      - "/api/auth/login"
    accounts:
      - "/auth/jwt/all-accounts"
      - "/trade/accounts"
      - "/api/trade/accounts"
    instruments:
      - "/trade/accounts/{account_id}/instruments"
      - "/trade/instruments"
      - "/api/trade/accounts/{account_id}/instruments"
    candles:
      - "/trade/accounts/{account_id}/instruments/{instrument_id}/history"
      - "/trade/history"
      - "/api/trade/accounts/{account_id}/instruments/{instrument_id}/history"
    orders:
      - "/trade/accounts/{account_id}/orders"
      - "/trade/orders"
      - "/api/trade/accounts/{account_id}/orders"
